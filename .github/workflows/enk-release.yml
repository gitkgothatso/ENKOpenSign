name: enk-release

# Builds the ENK product images from a release tag on enk-sign-master,
# pushes them to GHCR, and attaches an offline image bundle (for air-gapped
# on-prem installs) to the GitHub Release.

on:
  push:
    tags:
      - 'v*-enk.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v1.0.0-enk.1); must already exist'
        required: true

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

env:
  REGISTRY: ghcr.io
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: enk-sign-web
            dockerfile: apps/OpenSign/Dockerhubfile
          - name: enk-sign-server
            dockerfile: apps/OpenSignServer/Dockerhubfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=sha

      # amd64 only: the server image installs LibreOffice, which is very slow under QEMU.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: APP_VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  offline-bundle:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save images to a tarball
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          images="$REGISTRY/$owner/enk-sign-web:$VERSION $REGISTRY/$owner/enk-sign-server:$VERSION mongo:8.0 caddy:2"
          for i in $images; do docker pull "$i"; done
          docker save $images | gzip > "enk-sign-images-$VERSION.tar.gz"
          sha256sum "enk-sign-images-$VERSION.tar.gz" > "enk-sign-images-$VERSION.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$VERSION" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$VERSION" -R "${{ github.repository }}" --title "$VERSION" --generate-notes --verify-tag
          gh release upload "$VERSION" -R "${{ github.repository }}" --clobber \
            "enk-sign-images-$VERSION.tar.gz" "enk-sign-images-$VERSION.tar.gz.sha256"

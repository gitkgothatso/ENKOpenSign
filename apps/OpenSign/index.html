    // actually substituting process.env.REACT_APP_* references when Vite dev-serves this file (verified via
    // direct fetch of the transformed module - the source comes back completely unchanged). getEnv() in
    // Utils.js reads window.RUNTIME_ENV *before* falling back to process.env, so setting it here sidesteps
    // the broken substitution entirely.
    window.RUNTIME_ENV = { REACT_APP_SERVERURL: "http://localhost:8080/app" };
  </script>

# ENK Sign production stack: one isolated instance per client, same file for cloud VMs and on-prem.
# Managed with deploy/bin/enk-sign (see deploy/README.md); settings come from deploy/.env.
name: ${COMPOSE_PROJECT_NAME:-enk-sign}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  server:
    image: ${ENK_REGISTRY:-ghcr.io/gitkgothatso}/enk-sign-server:${ENK_VERSION:?ENK_VERSION must be set in .env}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/OpenSignDB
      PARSE_MOUNT: /app
      SERVER_URL: ${PUBLIC_URL:?PUBLIC_URL must be set in .env}/api/app
      PUBLIC_URL: ${PUBLIC_URL}
      APP_NAME: ${BRAND_NAME:-}
      EMAIL_TEMPLATES_DIR: /config/email
    volumes:
      # Uploaded documents (local storage). Mounted on files/files so the
      # image's built-in files (fonts, default templates) stay visible.
      - files:/usr/src/app/files/files
      - ./config/email:/config/email:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/app/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *logging

  web:
    image: ${ENK_REGISTRY:-ghcr.io/gitkgothatso}/enk-sign-web:${ENK_VERSION}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    # Only public, non-secret values: they are served to browsers via /env.js.
    environment:
      REACT_APP_SERVERURL: ${PUBLIC_URL}/api/app
      REACT_APP_BRAND_NAME: ${BRAND_NAME:-}
      REACT_APP_BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      REACT_APP_BRAND_FAVICON_URL: ${BRAND_FAVICON_URL:-}
      REACT_APP_EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      REACT_APP_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      REACT_APP_HIDE_SOCIAL: ${HIDE_SOCIAL:-true}
      REACT_APP_SOURCE_URL: ${SOURCE_URL:-https://github.com/gitkgothatso/ENKOpenSign}
    volumes:
      - ./config/brand:/config/brand:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
      - server
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set in .env}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Local testing only: `docker compose --profile dev up` catches all mail at http://<host>:1080
  maildev:
    image: maildev/maildev:2.2.1
    profiles: ["dev"]
    ports:
      - "1080:1080"
    logging: *logging

volumes:
  mongo-data:
  files:
  caddy-data:
  caddy-config:
